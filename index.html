<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D T-Shirt Stock Management</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            background-color: #1e1e24;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        #canvas-container {
            flex: 1;
            position: relative;
        }
        #ui-container {
            flex: 1;
            padding: 40px;
            background: #2b2b36;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: #ff6b6b;
            text-align: center;
            border-bottom: 2px solid #ff6b6b;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .control-group {
            background: #363645;
            padding: 15px;
            border-radius: 8px;
        }
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 4px;
            box-sizing: border-box;
        }
        select, input {
            background-color: #4a4a5e;
            color: white;
        }
        button {
            background-color: #ff6b6b;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #ff4757;
        }
        .btn-sell {
            background-color: #1dd1a1;
        }
        .btn-sell:hover {
            background-color: #10ac84;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .stat-card {
            background: #363645;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-top: 4px solid #ff6b6b;
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #ccc;
        }
        .stat-value {
            font-weight: bold;
            color: white;
            font-size: 1.1em;
        }
        #alert-box {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            text-align: center;
            display: none;
        }
        .alert-success { background-color: rgba(29, 209, 161, 0.2); border: 1px solid #1dd1a1; color: #1dd1a1; }
        .alert-error { background-color: rgba(255, 107, 107, 0.2); border: 1px solid #ff6b6b; color: #ff6b6b; }
    </style>
    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-container">
        <h1>T-Shirt Stock Management</h1>

        <div id="alert-box"></div>

        <div class="controls">
            <div class="control-group">
                <h3>Add Stock (In)</h3>
                <label for="add-size">Size:</label>
                <select id="add-size">
                    <option value="S">Small (S)</option>
                    <option value="M">Medium (M)</option>
                    <option value="L">Large (L)</option>
                    <option value="XL">Extra Large (XL)</option>
                </select>
                <label for="add-qty">Quantity:</label>
                <input type="number" id="add-qty" min="1" value="1">
                <button onclick="addStock()">Add Stock</button>
            </div>

            <div class="control-group">
                <h3>Sell Stock (Out)</h3>
                <label for="sell-size">Size:</label>
                <select id="sell-size">
                    <option value="S">Small (S)</option>
                    <option value="M">Medium (M)</option>
                    <option value="L">Large (L)</option>
                    <option value="XL">Extra Large (XL)</option>
                </select>
                <label for="sell-qty">Quantity:</label>
                <input type="number" id="sell-qty" min="1" value="1">
                <button class="btn-sell" onclick="sellStock()">Sell Stock</button>
            </div>
        </div>

        <h2>Current Inventory</h2>
        <div class="stats-grid" id="stats-container">
            <!-- Stats will be injected here via JS -->
        </div>
    </div>

    <script>
        // --- 1. LOCAL STORAGE MANAGEMENT (No Database) ---

        // Initialize default data structure if it doesn't exist
        const defaultStock = {
            S: { added: 0, sold: 0 },
            M: { added: 0, sold: 0 },
            L: { added: 0, sold: 0 },
            XL: { added: 0, sold: 0 }
        };

        function getStockData() {
            const data = localStorage.getItem('tshirtStockData');
            return data ? JSON.parse(data) : defaultStock;
        }

        function saveStockData(data) {
            localStorage.setItem('tshirtStockData', JSON.stringify(data));
            updateUI();
            animateTshirt(); // Trigger visual feedback
        }

        function showAlert(msg, isSuccess) {
            const box = document.getElementById('alert-box');
            box.textContent = msg;
            box.className = isSuccess ? 'alert-success' : 'alert-error';
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 3000);
        }

        function addStock() {
            const size = document.getElementById('add-size').value;
            const qty = parseInt(document.getElementById('add-qty').value);

            if(isNaN(qty) || qty <= 0) {
                showAlert('Please enter a valid quantity.', false);
                return;
            }

            let data = getStockData();
            data[size].added += qty;
            saveStockData(data);
            showAlert(`Successfully added ${qty} ${size} t-shirts.`, true);
        }

        function sellStock() {
            const size = document.getElementById('sell-size').value;
            const qty = parseInt(document.getElementById('sell-qty').value);

            if(isNaN(qty) || qty <= 0) {
                showAlert('Please enter a valid quantity.', false);
                return;
            }

            let data = getStockData();
            const currentStock = data[size].added - data[size].sold;

            if (qty > currentStock) {
                showAlert(`Error: Only ${currentStock} ${size} t-shirts left in stock!`, false);
                return;
            }

            data[size].sold += qty;
            saveStockData(data);
            showAlert(`Successfully sold ${qty} ${size} t-shirts.`, true);
        }

        function updateUI() {
            const data = getStockData();
            const container = document.getElementById('stats-container');
            container.innerHTML = '';

            const sizes = ['S', 'M', 'L', 'XL'];

            sizes.forEach(size => {
                const added = data[size].added;
                const sold = data[size].sold;
                const remaining = added - sold;

                const cardHTML = `
                    <div class="stat-card">
                        <h3 style="color: ${remaining > 0 ? '#1dd1a1' : '#ff6b6b'}">Size ${size}</h3>
                        <div class="stat-row">
                            <span>Total Added:</span>
                            <span class="stat-value">${added}</span>
                        </div>
                        <div class="stat-row">
                            <span>Total Sold:</span>
                            <span class="stat-value">${sold}</span>
                        </div>
                        <div class="stat-row" style="margin-top: 10px; border-top: 1px solid #4a4a5e; padding-top: 5px;">
                            <span>Remaining:</span>
                            <span class="stat-value" style="font-size: 1.3em; color: ${remaining > 0 ? '#fff' : '#ff6b6b'}">${remaining}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Initial UI load
        updateUI();


        // --- 2. 3D ANIMATION (Three.js) ---

        const canvasContainer = document.getElementById('canvas-container');

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1e1e24');

        const camera = new THREE.PerspectiveCamera(75, canvasContainer.clientWidth / canvasContainer.clientHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
        canvasContainer.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        // Simple T-Shirt Representation (using simple geometries)
        const tShirtGroup = new THREE.Group();

        // Body
        const bodyGeo = new THREE.BoxGeometry(2, 2.5, 0.5);
        const clothMat = new THREE.MeshPhongMaterial({ color: 0xff6b6b });
        const bodyMesh = new THREE.Mesh(bodyGeo, clothMat);
        tShirtGroup.add(bodyMesh);

        // Left Sleeve
        const sleeveGeo = new THREE.BoxGeometry(0.8, 1, 0.5);
        const lSleeve = new THREE.Mesh(sleeveGeo, clothMat);
        lSleeve.position.set(-1.3, 0.5, 0);
        lSleeve.rotation.z = Math.PI / 6;
        tShirtGroup.add(lSleeve);

        // Right Sleeve
        const rSleeve = new THREE.Mesh(sleeveGeo, clothMat);
        rSleeve.position.set(1.3, 0.5, 0);
        rSleeve.rotation.z = -Math.PI / 6;
        tShirtGroup.add(rSleeve);

        scene.add(tShirtGroup);

        // Animation Loop
        let bounce = 0;
        let isAnimating = false;

        function animate() {
            requestAnimationFrame(animate);

            // Base rotation
            tShirtGroup.rotation.y += 0.005;

            // Triggered animation (when stock is added/sold)
            if (isAnimating) {
                bounce += 0.2;
                tShirtGroup.position.y = Math.sin(bounce) * 0.5;
                if (bounce > Math.PI * 2) {
                    bounce = 0;
                    isAnimating = false;
                    tShirtGroup.position.y = 0;
                }
            }

            // Make it float slightly
            if(!isAnimating){
               tShirtGroup.position.y = Math.sin(Date.now() * 0.002) * 0.1;
            }

            renderer.render(scene, camera);
        }
        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
        });

        // Trigger animation function called by stock functions
        function animateTshirt() {
            isAnimating = true;
            // Change color randomly slightly to show activity
            const colors = [0xff6b6b, 0x1dd1a1, 0x5f27cd, 0x54a0ff];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            tShirtGroup.children.forEach(child => {
                child.material.color.setHex(randomColor);
            });
        }
    </script>
</body>
</html>
